<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cosmic farmland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* two registers only: a typewriter for the institution, one serif for the text. */
  :root{
    --card:#ece3ce;
    --ink:#141310;
    --ink-2:#3a352b;
    --ink-3:#6c6453;
    --slip:#f2ead6;
    --hair:rgba(48,38,20,.34);
    --rule:rgba(20,19,16,.18);
    /* one measure for the whole sheet. anything that bleeds past the text
       column offsets by exactly this, so nothing lands half a pixel off. */
    --pad:max(28px, calc((100vw - 1240px) / 2));
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    overflow-x:hidden;
    background:var(--card);
    color:var(--ink);
    font-family:Spectral, Georgia, serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- the sheet: cream to all four edges ---------- */
  .sheet{
    position:relative;
    min-height:100vh;
    padding:0 var(--pad) 44px;
    background:#f2ede0;
    overflow:clip;          /* clips the foxing without trapping position:sticky */
  }
  /* scanned rag fibre. big tile, low opacity: felt, not counted. */
  .sheet::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none; z-index:1;
    mix-blend-mode:multiply;
    opacity:.12;
    background-image:url("img/paper.jpg");
    background-size:760px auto;
    background-repeat:repeat;
  }
  /* low-frequency tonal drift. the sheet is not one flat value anywhere. */
  .sheet::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none; z-index:2;
    mix-blend-mode:multiply;
    opacity:.55;
    background:
      radial-gradient(120% 70% at 12% 4%,   rgba(255,252,242,.85), rgba(255,252,242,0) 62%),
      radial-gradient(90% 55% at 88% 26%,   rgba(150,130,86,.16),  rgba(150,130,86,0) 70%),
      radial-gradient(130% 60% at 30% 62%,  rgba(255,251,238,.7),  rgba(255,251,238,0) 66%),
      radial-gradient(80% 46% at 6% 88%,    rgba(142,120,76,.19),  rgba(142,120,76,0) 72%),
      radial-gradient(100% 50% at 96% 96%,  rgba(150,128,80,.15),  rgba(150,128,80,0) 70%);
  }
  .sheet > *{position:relative; z-index:4}

  /* discrete foxing. four marks, clustered, not scattered. */
  .fox{ position:absolute; z-index:3; pointer-events:none; mix-blend-mode:multiply; opacity:.5 }

  /* ---------- stamped block, top left ---------- */
  .stamp{
    font-family:"IBM Plex Mono", monospace;
    font-weight:500;
    font-size:19px;
    letter-spacing:.34em;
    line-height:1.4;
    color:var(--ink);
    display:inline-block;
  }
  .stamp small{
    display:block;
    font-weight:400; font-size:8.5px; letter-spacing:.26em;
    color:var(--ink-3); margin-top:7px;
  }

  /* ---------- the sheet's ruled divisions ----------
     rows are explicit, so the vertical rule only runs where two plates actually
     face each other, and a full-width plate breaks it cleanly. */
  .plate{ position:relative; margin-top:26px }
  .row{
    display:grid; grid-template-columns:1fr 1fr;
    border-top:1px solid var(--rule);
  }
  .row.full{ grid-template-columns:1fr }
  .row:not(.full) > .sp:first-child{ border-right:1px solid var(--rule) }
  .sp{ display:flex; flex-direction:column; padding:40px 34px 48px }
  .mount{
    --s:1;                 /* per specimen, set on the element. see the data. */
    position:relative; width:fit-content; max-width:100%; margin:0 auto;
    height:calc(340px * var(--s));
    display:flex; align-items:center; justify-content:center;
  }
  .mount img{ display:block; width:auto; height:auto; max-width:100%; max-height:100% }

  /* real pressed material, all nine. multiply drops the scan matte so the
     sheet fibre reads straight through; the duotone pulls them to the ink. */
  .ph{
    mix-blend-mode:multiply;
    opacity:.9;
    filter:grayscale(1) sepia(.62) saturate(1.5) hue-rotate(-16deg) contrast(1.22) brightness(.95);
  }
  .ph.pale{
    opacity:.94;
    filter:grayscale(1) sepia(.62) saturate(1.8) hue-rotate(-16deg) contrast(2.5) brightness(.74);
  }
  .ph.faint{   /* bleached to nearly nothing. without this the sheet eats it. */
    opacity:1;
    filter:grayscale(1) sepia(.62) saturate(2.2) hue-rotate(-16deg) contrast(3.6) brightness(.52);
  }

  /* ---------- gummed hinges: short strips, torn at the two short ends ---------- */
  .hinge{
    position:absolute; z-index:6;
    background:linear-gradient(180deg, rgba(229,219,191,.82), rgba(212,199,166,.78));
  }
  .h1{ clip-path:polygon(3% 0%,100% 0%,97% 22%,100% 48%,96% 74%,100% 100%,4% 100%,0% 76%,5% 50%,1% 24%) }
  .h2{ clip-path:polygon(0% 0%,97% 0%,100% 26%,95% 52%,99% 78%,96% 100%,2% 100%,5% 72%,0% 46%,4% 20%) }
  .h3{ clip-path:polygon(2% 0%,98% 0%,100% 30%,96% 55%,100% 80%,97% 100%,3% 100%,0% 74%,4% 48%,1% 22%) }
  /* one hard contact line, lift edge only. nothing blurred, nothing floats. */
  .hinge::after{
    content:""; position:absolute; left:8%; right:8%; bottom:0; height:1px;
    background:rgba(58,45,22,.34);
  }

  /* ---------- accession labels: printed flat onto the sheet ---------- */
  .lab{
    display:block; width:292px; max-width:100%;
    padding:8px 0 0; border-top:1px solid rgba(20,19,16,.55);
  }
  .lab .no{
    font-family:"IBM Plex Mono", monospace;
    font-weight:500; font-size:9.5px; letter-spacing:.2em;
    color:var(--ink-3); display:block;
  }
  .lab .name{
    display:block;
    font-weight:400; font-size:20px; line-height:1.12;
    color:var(--ink); margin-top:3px; text-wrap:balance;
  }
  .lab .d{
    display:block; font-size:13px; line-height:1.45; max-width:34em;
    color:var(--ink-2); margin-top:4px; text-wrap:balance;
  }
  .lab .fld{
    display:block; margin-top:6px;
    font-family:"IBM Plex Mono", monospace;
    font-size:10px; letter-spacing:.14em; color:var(--ink-2);
  }
  .lab .fld em{ font-style:normal; color:#2a261e; letter-spacing:.05em }
  .card:hover .name{ text-decoration:underline; text-decoration-thickness:.5px; text-underline-offset:4px }
  .lab{ margin-top:0; align-self:stretch; width:100%; border-top:0;
        padding:16px 0 36px }

  /* ---------- the field where the speckle resolves ---------- */
  #field{ position:absolute; right:2%; top:38%; width:380px; height:220px; pointer-events:none; z-index:3 }
  #field i{ position:absolute; border-radius:50%; background:#141310; display:block }


  /* ---------- the print: one object, one window, one caption band ---------- */
  .card{
    position:relative; display:flex; flex-direction:column;
    width:392px; max-width:100%; height:452px;
    background:#f2ede0;
    padding:22px 22px 0;
    box-shadow:0 0 0 .5px rgba(58,45,22,.34), 6px 8px 14px -10px rgba(40,31,14,.55);
  }
  .card .mount{
    --s:1;                      /* one window. the print is the fixed thing. */
    width:100%; margin:0; flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
  }
  .card .mount img{ max-width:100%; max-height:100% }

  .card .lab{ flex:0 0 auto }
  .sp{ align-items:center; justify-content:flex-start }


  /* ---------- section register: a ruled heading, same voice as the labels ---------- */
  .reg{ margin-top:60px }
  #apps{ margin-top:46px }
  .reg > h2{
    margin:0 0 2px;
    font-family:"IBM Plex Mono", monospace; font-weight:500;
    font-size:10px; letter-spacing:.3em; color:var(--ink);
  }
  .reg > h2 .ct{ color:var(--ink-3); margin-left:12px; letter-spacing:.2em; font-weight:400 }

  /* ---------- index: the sheet's own contents, printed in the header ---------- */
  .idx{
    display:flex; gap:26px; align-items:baseline;
    font-family:"IBM Plex Mono", monospace;
    font-size:10px; letter-spacing:.24em; color:var(--ink-3);
  }
  .idx a{ color:var(--ink-2); padding-bottom:2px; border-bottom:1px solid transparent }
  .idx a:hover, .idx a.on{ color:var(--ink); border-bottom-color:rgba(20,19,16,.55) }
  .sheet > .head{
    position:relative; z-index:20;
    display:flex; justify-content:space-between; align-items:baseline;
    margin:0 calc(-1 * var(--pad));
    padding:30px var(--pad) 15px;
  }
  .sheet > .head::after{     /* stops on the measure, like every other rule */
    content:""; position:absolute; left:var(--pad); right:var(--pad);
    bottom:0; height:1px;
    background:var(--rule);
  }

  /* ---------- toolshed: laid flat on the sheet, ruled like everything else ---------- */
  .shed{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--rule) }
  .shed > div{ padding:34px 34px 40px }
  .shed > div:first-child{ border-right:1px solid var(--rule) }
  .shed h3{
    margin:0 0 18px;
    font-family:"IBM Plex Mono", monospace; font-weight:500;
    font-size:9px; letter-spacing:.24em; color:var(--ink-3);
  }
  .shed a{
    display:grid; grid-template-columns:132px 1fr; gap:14px; align-items:baseline;
    padding:7px 0;
    font-size:12.5px; line-height:1.35; color:var(--ink-2);
  }
  .shed a b{
    font-family:"IBM Plex Mono", monospace; font-weight:400; font-size:12px;
    letter-spacing:.02em; color:var(--ink);
  }
  .shed a:hover b{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:.5px }

  /* ---------- colophon: one stamped block on flat ground ---------- */
  .colwrap{ display:flex; justify-content:flex-start; margin-top:38px }
  .col{
    width:330px; transform:rotate(.5deg);
    font-family:"IBM Plex Mono", monospace;
    font-size:9.5px; letter-spacing:.12em; color:#4c4638;
  }
  .col .hd{ display:block; letter-spacing:.28em; color:var(--ink); margin-bottom:11px; font-weight:500 }
  .col div{ display:grid; grid-template-columns:74px 1fr; line-height:2 }
  .col span{
    font-weight:500; font-size:8.5px; letter-spacing:.2em; color:var(--ink-3);
  }
  .col em{ font-style:normal; color:var(--ink); letter-spacing:.06em; font-size:10px }

  footer{
    margin-top:54px; font-size:9px; letter-spacing:.15em; color:#5f5849;
    font-family:"IBM Plex Mono", monospace;
  }
  footer a{ border-bottom:.5px solid rgba(112,94,58,.35) }
  footer a:hover{ color:var(--ink) }

  @media (max-width:900px){
    .row, .shed{ grid-template-columns:1fr }
    .row:not(.full) > .sp:first-child, .shed > div:first-child{ border-right:0 }
    .sp{ padding:30px 0 36px }
    .shed > div{ padding:26px 0 30px }
    .shed > div + div{ border-top:1px solid var(--rule) }
    .shed a{ grid-template-columns:1fr; gap:3px }
    .mount, .row.full .mount{ height:300px }
    .mount img, .row.full .mount img{ max-height:300px }
    .lab{ width:100% }
    #field{ display:none }
    .head{ flex-direction:column; gap:14px }
    .colwrap{ margin-top:44px }
    .col{ transform:none }
  }
</style>
</head>
<body>

<main class="sheet">
  <header class="head">
    <div class="stamp">cosmic farmland</div>
    <nav class="idx">
      <a href="#apps">apps</a>
      <a href="#golf">golf</a>
      <a href="#toolshed">toolshed</a>
    </nav>
  </header>

  <section class="reg" id="apps">
    <h2>apps</h2>
    <div class="plate" id="plate"></div>
  </section>

  <section class="reg" id="golf">
    <h2>golf</h2>
    <div class="plate" id="golfplate"></div>
  </section>

  <section class="reg" id="toolshed">
    <h2>toolshed <span class="ct">20 skills, 7 commands, 4 plugins</span></h2>
    <div class="shed" id="packet"></div>
  </section>

  <div class="colwrap">
    <div class="col">
      <div class="hd">cosmic farmland</div>
      <div><span>acc.</span><em>cf 2026 / 001-010</em></div>
      <div><span>coll.</span><em>m. houston</em></div>
      <div><span>loc.</span><em>cosmicfarmland.wtf</em></div>
      <div><span>field</span><em>18h 36m 56s &nbsp;+38&deg; 47&prime; 01&Prime;</em></div>
      <div><span>det.</span><em>m. houston, 2026</em></div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/marshallhouston/cosmic-farmland">cosmicfarmland.wtf / source on github</a>
  </footer>
</main>

<script>
/* ---------------- the sheet ----------------
   ten pressed colorado natives, one per live page, accessioned in sheet order.
   rows are explicit: a full-width plate opens the apps register and another
   closes it, everything between faces its pair across the centre rule. */
/* hinge coordinates are measured off each specimen's own alpha mass, so every
   strip crosses real plant material instead of floating in open paper. */

const apps = [
  { no:"cf-001", n:"marshallhouston.wtf", u:"https://marshallhouston.wtf",
    d:"writing about the cosmic farmland",
    img:"specimen-ice-plant.png", alt:"a pressed hardy ice plant sprig, thick fleshy leaves and one star-shaped flower",
    rot:2.4, full:1, loc:"marshallhouston.wtf", h:[[27.5, 13.3, 26, 0.0], [9.5, 77.8, 34, 31.1]] },

  { no:"cf-002", n:"anthology '77", u:"https://grateful-dead-77.cosmicfarmland.wtf",
    d:"every show of the grateful dead's spring 1977 tour, mapped, with setlists and tapes",
    img:"specimen-bee-balm.png", alt:"a pressed bee balm flower head, shaggy tubular petals radiating from the crown",
    rot:-3.5, loc:"grateful-dead-77", h:[[50.0, 30.1, 34, -2.8], [49.6, 72.2, 21, -2.6]] },

  { no:"cf-003", n:"lenny explorer", u:"https://lenny-explorer.cosmicfarmland.wtf",
    d:"a reader for lenny's newsletter posts and podcast transcripts",
    img:"specimen-aster.png", alt:"a pressed aster stem, narrow leaves and small daisy-like flower heads", pale:1,
    rot:-2.4, loc:"lenny-explorer", h:[[50.5, 34.0, 20, -4.0], [49.8, 84.4, 28, -12.3]] },

  { no:"cf-004", n:"systems playground", u:"https://systems-thinking.cosmicfarmland.wtf",
    d:"stocks, flows, feedback loops, delays, and meadows' twelve leverage points",
    img:"specimen-blue-salvia.png", alt:"a pressed blue salvia spike, narrow leaves and a tall row of tubular flowers",
    rot:3.5, loc:"systems-thinking", h:[[51.1, 24.9, 34, 5.1], [49.9, 82.3, 29, -0.0]] },

  { no:"cf-005", n:"strategy wizard", u:"https://strategy-wizard.cosmicfarmland.wtf",
    d:"build a real action agenda and let an inline critic tear at it",
    img:"specimen-furmans-red-sage.png", alt:"a pressed furman's red sage stem, small oval leaves and a spike of tubular flowers",
    rot:-2.2, loc:"strategy-wizard", h:[[49.2, 47.9, 21, 18.4], [50.0, 87.9, 34, -5.7]] },

  { no:"cf-006", n:"bobby bowser arcade", u:"https://bobby-bowser.cosmicfarmland.wtf",
    d:"ten cabinets of coding-craft minigames. defeat bad practices, collect good ones",
    img:"specimen-hyssop.png", alt:"a single pressed anise hyssop spike, tall and narrow, dense with tiny dried flowers",
    rot:2, loc:"bobby-bowser", h:[[50.5, 26.3, 34, -4.2], [50.0, 77.1, 31, 0.7]] },

  { no:"cf-007", n:"octopus antipatterns", u:"https://octopus-org-lair.cosmicfarmland.wtf",
    d:"36 org antipatterns to browse, drill with recall quizzes, and diagnose",
    img:"specimen-hummingbird-mint.png", alt:"a pressed hummingbird mint stem, triangular leaves and a loose spike of flowers",
    rot:-3, loc:"octopus-org-lair", h:[[37.7, 49.6, 23, -90.0], [87.7, 50.6, 34, -90.0]] },

  { no:"cf-008", n:"golf course designer", u:"https://golf-course-designer.cosmicfarmland.wtf",
    d:"shape nine holes of dirt, then let a simulated field of real handicaps judge them",
    img:"specimen-yarrow.png", alt:"a pressed yarrow stem, feathery leaves and a flat cluster of tiny flowers", pale:1,
    rot:4, full:1, loc:"golf-course-designer", h:[[48.7, 66.0, 20, -2.0], [50.2, 88.0, 22, 1.0]] }
];

/* the two golf pages that are live today, from the same cabinet */
const golf = [
  { no:"cf-009", n:"the war on double bogeys", u:"/golf", kick:"the record",
    d:"every round on my ghin record, filterable: handicap arc, scoring buckets, and where the shots actually go",
    img:"specimen-echinacea.png", alt:"a pressed echinacea flower head, drooping dried petals around a spiky cone center",
    rot:-4, loc:"/golf", h:[[40.2, 49.5, 29, -74.2], [83.6, 78.0, 34, -70.9]] },

  { no:"cf-010", n:"sunday, hole by hole", u:"/golf/city-am-2026", kick:"2026 denver city am",
    d:"final round of the 2026 denver city amateur. round 1 leader by 2 strokes. winner by 1",
    img:"specimen-pitcher-salvia.png", alt:"a pressed pitcher sage stem, sparse tubular flowers along a thin spike",
    rot:3, loc:"/golf/city-am-2026", h:[[67.2, 39.5, 18, -90.0], [84.8, 24.2, 28, -90.0]] }
];

const tools = {
  commands: [
    ["/ship", "wait for a pr to go green, merge it, clean the worktree"],
    ["/ptv", "prove-the-value audit that flags bloat"],
    ["/next", "what to work on next in this repo"],
    ["/handoff", "self-contained resumption prompt"],
    ["/deps-sweep", "bucket outdated deps, one pr per bucket"],
    ["/systematize", "promote a lesson to enforcement"],
    ["/wrap", "end-of-session cap, ship then hand off"]
  ],
  plugins: [
    ["cosmic-farmland", "always-on core, and the hooks"],
    ["cosmic-farmland-content", "feedback pages, review docs, granola sync"],
    ["cosmic-farmland-utils", "tee times, activity stats, deploys"],
    ["obsidian-weaver", "vault interface with an auto-weaving graph"]
  ]
};

/* ---------------- mount ---------------- */
function plateHTML(a){
  const hinges = a.h.map(([x,y,len,r],j) =>
    `<span class="hinge h${(j%3)+1}" style="left:${x}%;top:${y}%;width:${len}px;height:${9+(j%3)}px;transform:translate(-50%,-50%) rotate(${r}deg)"></span>`).join("");
  return `<span class="sp">
    <a class="card" href="${a.u}" style="transform:rotate(${(a.rot*0.42).toFixed(2)}deg)">
      <span class="mount">
        <img class="ph${a.pale?" pale":""}" src="img/${a.img}" alt="${a.alt}">
      </span>
      <span class="lab">
        <span class="no">${a.no}${a.kick?" &nbsp;/&nbsp; "+a.kick:""}</span>
        <span class="name">${a.n}</span>
        <span class="d">${a.d}</span>
        ${a.loc.replace(/-/g," ") === a.n ? "" : `<span class="fld">loc. <em>${a.loc}</em></span>`}
      </span>
    </a>
  </span>`;
}

/* pack into rows: a full-width plate takes its own row, the rest pair up */
function rows(list){
  let out = "", pair = [];
  const flush = () => { if (pair.length){ out += `<div class="row">${pair.join("")}</div>`; pair = []; } };
  list.forEach(a => {
    if (a.full){ flush(); out += `<div class="row full">${plateHTML(a)}</div>`; }
    else { pair.push(plateHTML(a)); if (pair.length === 2) flush(); }
  });
  flush();
  return out;
}

document.getElementById("plate").innerHTML = rows(apps) + '<div id="field"></div>';
document.getElementById("golfplate").innerHTML = rows(golf);

/* ---------------- toolshed ---------------- */
const src = "https://github.com/marshallhouston/cosmic-farmland";
const row = ([c,d]) => `<a href="${src}"><b>${c}</b><span>${d}</span></a>`;
document.getElementById("packet").innerHTML =
  `<div><h3>commands</h3>${tools.commands.map(row).join("")}</div>` +
  `<div><h3>plugins</h3>${tools.plugins.map(row).join("")}</div>`;

/* ---------------- foxing: four discrete clusters ---------------- */
const rnd = (i) => { const v = Math.sin(i*127.1+4.7)*43758.5453; return v - Math.floor(v); };
document.querySelector(".sheet").insertAdjacentHTML("afterbegin",
  [[9,320,74],[71,86,58],[36,1268,66],[88,1540,52]].map(([lx,ty,size],c) => {
    let dots = "";
    for (let i=0;i<11;i++){
      const sz = 1.4 + rnd(c*40+i)*4.6;
      const x = rnd(c*40+i+7)*(size-sz), y = rnd(c*40+i+19)*(size-sz);
      dots += `<i style="position:absolute;left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;border-radius:50%;background:rgba(122,86,36,${(.16+rnd(c*40+i+31)*.3).toFixed(2)});filter:blur(.4px)"></i>`;
    }
    return `<span class="fox" style="left:${lx}%;top:${ty}px;width:${size}px;height:${size}px">${dots}</span>`;
  }).join(""));

/* ---------------- lyra, at the coordinate on the slip ----------------
   ra hours, dec degrees, visual magnitude. the speckle resolves, nothing is drawn. */
const lyra = [
  [18.6156,38.784,0.03],[18.8347,33.363,3.52],[18.9824,32.690,3.24],
  [18.9135,36.899,4.22],[18.7460,37.605,4.36],[18.7373,39.670,4.67],
  [18.7462,39.613,4.59],[18.3299,36.064,4.33],[19.2745,38.134,4.36],
  [19.2203,39.146,4.39],[19.1216,36.099,5.28],[18.8887,36.966,5.58],
  [19.0788,32.548,5.65],[18.5387,32.552,5.90],[19.2929,32.884,5.60],
  [18.4444,37.594,5.94],[19.1657,38.984,5.60],[18.6752,34.437,6.10]
];
const fld = document.getElementById("field"), W = 380, H = 220;
fld.innerHTML = lyra.map(([ra,dec,m]) => {
  const x = (19.40 - ra) / 1.15 * W, y = (40.6 - dec) / 9.0 * H;
  const sz = Math.min(3.6, Math.max(1.4, (7.0 - m) * 0.55)),
        o  = Math.min(.78, Math.max(.34, (7.0 - m) * .13));
  return `<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${sz.toFixed(2)}px;height:${sz.toFixed(2)}px;opacity:${o.toFixed(2)}"></i>`;
}).join("");

const marks = [...document.querySelectorAll(".idx a")];
const secs = marks.map(a => document.querySelector(a.getAttribute("href")));


/* ---------------- arrows step between registers ---------------- */
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target.tagName; if (t === "INPUT" || t === "TEXTAREA") return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  const tops = secs.map(x => Math.round(x.getBoundingClientRect().top + scrollY) - 96);
  const y = scrollY + 4;
  let i = 0; tops.forEach((top, k) => { if (top <= y) i = k; });
  i = e.key === "ArrowRight"
      ? Math.min(i + 1, tops.length - 1)
      : (scrollY > tops[i] + 4 ? i : Math.max(i - 1, 0));
  scrollTo({ top: tops[i], behavior: "smooth" });
});

/* ---------------- index marks the register you are in ---------------- */
addEventListener("scroll", () => {
  const y = scrollY + innerHeight * .34;
  let cur = 0;
  secs.forEach((sec, i) => { if (sec && sec.getBoundingClientRect().top + scrollY <= y) cur = i; });
  marks.forEach((a, i) => a.classList.toggle("on", i === cur));
}, { passive:true });
</script>
