<!doctype html><meta charset=utf-8>
<title>hinge transform check</title>
<style>
 body{background:#f2ede0;font:12px ui-monospace,monospace;color:#141310;margin:0;padding:24px;
      display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px}
 figure{margin:0}
 .mount{position:relative;display:inline-block;line-height:0}
 .mount img{max-width:100%;height:auto;mix-blend-mode:multiply;
   filter:grayscale(1) sepia(.62) saturate(1.5) hue-rotate(-16deg) contrast(1.22) brightness(.95)}
 .hinge{position:absolute;z-index:6;background:linear-gradient(180deg,rgba(229,219,191,.82),rgba(212,199,166,.78));
   outline:1px solid rgba(200,40,40,.55)}
 figcaption{margin-top:8px;letter-spacing:.08em}
</style>
