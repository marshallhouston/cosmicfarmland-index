    <meta name="theme-color" content="#1b191c" media="(prefers-color-scheme: dark)" />
    <script>
      // Board-first: dark unless this browser has chosen daylight before.
      // Runs before paint so the board never flashes white.
      try {
        var t = localStorage.getItem('cf-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
